name: Tri des tickets

# Chaque nouveau ticket est journalisé, pour suivre le volume d'arrivée.
on:
  issues:
    types: [opened]

jobs:
  tri:
    runs-on: ubuntu-latest
    steps:
      # Le titre transite par une variable d'environnement et n'est lu que par
      # le shell. Il n'apparaît jamais dans le texte du script : GitHub ne le
      # substitue plus, il le transmet.
      - env:
          TITRE: ${{ github.event.issue.title }}
        run: |
          echo "Nouveau ticket : $TITRE"
